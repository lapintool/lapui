<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lapui ES module example</title>
  <style>
    html, body { margin: 0; min-height: 100%; font-family: sans-serif; background: #edf2f7; }
    main { padding: 32px; max-width: 640px; }
    h1 { color: #17324d; }
    button { padding: 10px 18px; cursor: pointer; background: #1d4ed8; color: white; border: 0; border-radius: 6px; }
    button:disabled { background: #64748b; }
    #module-count { font-size: 28px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Native ES modules</h1>
    <p id="module-status" role="status">Loading local module graph…</p>
    <p id="module-count" role="status">Count: 0</p>
    <button id="module-increment" disabled>Increment through Rust</button>
  </main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
