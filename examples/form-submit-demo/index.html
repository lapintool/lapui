<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lapui local forms</title><style>
html,body{margin:0;font-family:sans-serif;background:#edf3fb;color:#182b49}
main{max-width:720px;margin:24px auto;padding:24px;background:white;border:1px solid #c7d6eb;border-radius:12px}
h1{margin:0 0 12px;font-size:26px}p{line-height:1.5}
.field{margin:14px 0}label{display:block;margin-bottom:6px}
input[type=text],input[type=email],input[type=number],textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #a4b9d9;border-radius:5px;background:white;color:#182b49}
input[type=text],input[type=email],input[type=number]{height:40px}textarea{height:90px}.choice{display:flex;align-items:center;gap:8px}
.select-list{display:flex;flex-wrap:wrap;gap:6px;max-width:360px}.select-choice{width:auto;text-align:left;background:white}.select-choice[aria-selected=true]{border-color:#3458d4;background:#e8edff;color:#182b49}
.choice label{display:inline;margin:0}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
button{padding:10px 16px;border:1px solid #a4b9d9;border-radius:6px;background:#edf3fb;cursor:pointer}
#submit{background:#3458d4;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;padding:12px}
.readout{display:flex;align-items:center;gap:12px;margin:10px 0}.readout label{min-width:130px;margin:0}.readout input{flex:1;min-width:0;padding:8px}
@media(max-width:780px){main{margin:16px}}
</style></head><body><main>
<h1>Local form submission</h1>
<p>Required fields share validation between the window and AI controls. Submit records string values and calls a Rust action; reset restores the defaults.</p>
<form id="profile">
<div class="field"><label for="name">Name (at least 2 characters)</label><input id="name" name="name" type="text" required minlength="2" value="Ada"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required value="ada@example.test"></div>
<div class="field"><label for="quantity">Quantity (1 to 10)</label><input id="quantity" name="quantity" type="number" required min="1" max="10" step="1" value="2"></div>
<div class="field"><label>Preferred contact</label><select id="contact" name="contact" required hidden><option value="email">Email</option><option value="signal" selected>Signal</option><option value="none">No contact</option></select><div class="select-list" role="listbox" aria-label="Preferred contact"><button class="select-choice" id="contact-email" type="button" role="option" aria-selected="false" data-contact="email">Email</button><button class="select-choice" id="contact-signal" type="button" role="option" aria-selected="true" data-contact="signal">Signal</button><button class="select-choice" id="contact-none" type="button" role="option" aria-selected="false" data-contact="none">No contact</button></div></div>
<div class="field choice"><input id="agree" name="agree" type="checkbox" value="yes" required checked><label for="agree">I agree</label></div>
<div class="field choice"><input id="standard" name="delivery" type="radio" value="standard" checked><label for="standard">Standard delivery</label><input id="express" name="delivery" type="radio" value="express"><label for="express">Express delivery</label></div>
<div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes">Initial notes</textarea></div>
<div class="buttons"><button id="submit" name="command" value="save" type="submit">Submit</button><button id="reset" type="reset">Reset</button><button id="validate" type="button">Validate</button></div>
</form>
<div class="readout"><label for="status">Status</label><input id="status" readonly value="Ready"></div>
<div class="readout"><label for="submissions">Submissions</label><input id="submissions" readonly value="0"></div>
<div class="readout"><label for="count">Rust count</label><input id="count" readonly value="0"></div>
<pre id="entries" role="log">Submit to inspect form values.</pre>
<script>
const form=document.getElementById('profile'),byId=id=>document.getElementById(id);
let submitted=0;
form.addEventListener('invalid',event=>{byId('status').value='Invalid: '+event.target.name;},true);
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const values=[...new FormData(form,event.submitter)];
  byId('entries').textContent=JSON.stringify(values,null,2);
  byId('submissions').value=String(++submitted);byId('status').value='Submitting';
  try{const result=await lapui.invoke('counter.increment',{});byId('count').value=String(result.count);byId('status').value='Submitted';}
  catch(error){byId('status').value='Failed: '+error.message;}
});
form.addEventListener('reset',()=>{byId('status').value='Reset';});
const contact=byId('contact'),contactOptions=[...document.querySelectorAll('[data-contact]')];
function syncContact(){for(const option of contactOptions)option.setAttribute('aria-selected',String(option.getAttribute('data-contact')===contact.value));}
contact.addEventListener('change',syncContact);
for(const option of contactOptions)option.onclick=()=>{contact.value=option.getAttribute('data-contact');syncContact();__lapui_dispatch('input',contact.__ref,__lapui_event_path(contact.__ref));__lapui_dispatch('change',contact.__ref,__lapui_event_path(contact.__ref));};
for(const option of contactOptions)option.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();const index=contactOptions.indexOf(option);
  const next=event.key==='Home'?0:event.key==='End'?contactOptions.length-1:Math.max(0,Math.min(contactOptions.length-1,index+(event.key==='ArrowLeft'?-1:1)));
  contactOptions[next].focus();lapui.activate(contactOptions[next].__ref);
});
form.addEventListener('reset',()=>setTimeout(syncContact,0));
byId('validate').onclick=()=>{if(form.reportValidity())byId('status').value='Valid';};
</script></main></body></html>
