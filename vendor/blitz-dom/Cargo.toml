# Standalone manifest expanded from the pinned Blitz workspace. See LAPUI-PATCHES.md.
[package]
name = "blitz-dom"
description = "Blitz DOM implementation"
documentation = "https://docs.rs/blitz-dom"
version = "0.3.0-beta.2"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = ["svg", "woff", "accessibility", "system-fonts", "file-input", "custom-widget"]
custom-widget = ["dep:anyrender", "accessibility"]
tracing = ["dep:tracing"]
svg = ["dep:usvg", "dep:svgtypes"]
woff = ["dep:wuff"]
accessibility = ["accesskit"]
system-fonts = ["parley/system"]
complex-scripts = ["parley/complex-scripts"]
autofocus = []
floats = ["taffy/float_layout", "stylo_taffy/floats"]
file-input = []
scrollbars = []
parallel-construct = []
log-phase-times = ["debug_timer/enable"]

[dependencies]
blitz-traits = { "version" = "=0.3.0-beta.2", "default-features" = false, "git" = "https://github.com/DioxusLabs/blitz", "rev" = "8b54d6d2930f654d75446e423b42033d323205f0" }
stylo_taffy = { "version" = "=0.3.0-beta.2", "default-features" = false, "git" = "https://github.com/DioxusLabs/blitz", "rev" = "8b54d6d2930f654d75446e423b42033d323205f0", "features" = ["default"] }
debug_timer = { "version" = "0.1.2", "git" = "https://github.com/DioxusLabs/blitz", "rev" = "8b54d6d2930f654d75446e423b42033d323205f0" }
style = { "version" = "0.22.0", "package" = "stylo" }
selectors = { "version" = "0.41.0", "package" = "selectors" }
cssparser = { "version" = "0.38.0" }
style_config = { "version" = "0.22.0", "package" = "stylo_static_prefs" }
style_traits = { "version" = "0.22.0", "package" = "stylo_traits" }
style_dom = { "version" = "0.22.0", "package" = "stylo_dom" }
app_units = { "version" = "0.7.5" }
euclid = { "version" = "0.22" }
atomic_refcell = { "version" = "0.1.13" }
markup5ever = { "version" = "0.40.0" }
smallvec = { "version" = "1" }
thin-vec = { "version" = "0.2" }
taffy = { "git" = "https://github.com/DioxusLabs/taffy", "rev" = "ceb7443d386fc5cc67a1f72b51f7bf505439dff8", "default-features" = false, "features" = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
anyrender = { "version" = "0.14.0", "optional" = true }
accesskit = { "version" = "0.25", "optional" = true }
parley = { "git" = "https://github.com/linebender/parley", "rev" = "718dcb721941fd8e72128833122d31f5a4e80504", "default-features" = false, "features" = ["std"] }
skrifa = { "version" = "0.44", "default-features" = false, "features" = ["std"] }
linebender_resource_handle = { "version" = "0.1" }
color = { "version" = "0.3" }
kurbo = { "version" = "0.13.1" }
slotmap = { "version" = "1.0.7" }
bitflags = { "version" = "2.8.0" }
tracing = { "version" = "0.1.40", "optional" = true }
rayon = { "version" = "1" }
image = { "version" = "0.25.6", "default-features" = false }
usvg = { "version" = "0.48.1", "optional" = true }
svgtypes = { "version" = "0.16.1", "optional" = true }
wuff = { "version" = "0.2", "optional" = true }
html-escape = { "version" = "0.2.13" }
percent-encoding = { "version" = "2.3.1" }
url = { "version" = "2.5.0" }
keyboard-types = { "version" = "0.7" }
cursor-icon = { "version" = "1" }
thread_local = { "version" = "1" }
web-time = { "version" = "1" }

[target."cfg(any(target_vendor = \"apple\"))".dependencies]
objc2 = { "version" = "0.6", "features" = ["disable-encoding-assertions"] }
