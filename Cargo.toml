[package]
name = "lapui"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Experimental Rust desktop UI runtime with Blitz and QuickJS-ng"
repository = "https://github.com/lapintool/lapui"
readme = "README.md"
publish = false

[features]
default = ["complex-scripts", "software-renderer"]
complex-scripts = ["blitz-dom/complex-scripts"]
software-renderer = ["dep:anyrender_vello_cpu", "dep:image"]

[dependencies]
anyrender_vello = "=0.15.0"
anyrender_vello_cpu = { version = "=0.18.0", optional = true, default-features = false, features = ["softbuffer_window_renderer"] }
anyrender = "=0.14.0"
base64 = "=0.23.1"
data-url = "=0.3.2"
blitz-paint = { version = "=0.3.0-beta.2", default-features = false, features = ["svg", "scrollbars"] }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }
blitz = { version = "=0.3.0-beta.2", default-features = false, features = ["net"] }
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = ["system-fonts", "svg", "woff"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
fontique = "=0.11.1"
getrandom = "=0.3.4"
keyboard-types = "=0.7.0"
notify = "=8.2.0"
rquickjs = { version = "=0.14.0", features = ["loader"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-io", "transport-async-rw"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
style = { package = "stylo", version = "=0.22.0" }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "time", "io-util", "io-std"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "native-tls"] }
winit = { version = "=0.31.0-beta.3", default-features = false }

[dev-dependencies]
cursor-icon = "=1.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Blitz disables its shell's default features. Windows editing needs the real
# clipboard provider for Ctrl+C/X/V and clipboard-based text injection.
blitz-shell = { version = "=0.3.0-beta.2", default-features = false, features = ["clipboard"] }

# Candidate upstream snapshot for U1 table/layout compatibility. Registry beta.2
# lacks table-layout:fixed and column-group sizing already present on upstream
# main at this pinned commit. Keep the Blitz family on this baseline; the local
# DOM and paint packages retain that exact source plus documented bounded fixes.
# See vendor/blitz-dom/LAPUI-PATCHES.md before upgrading this group.
[patch.crates-io]
anyrender_vello = { path = "vendor/anyrender-vello" }
stylo = { path = "vendor/stylo" }
blitz = { git = "https://github.com/DioxusLabs/blitz", rev = "8b54d6d2930f654d75446e423b42033d323205f0" }
blitz-dom = { path = "vendor/blitz-dom" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "8b54d6d2930f654d75446e423b42033d323205f0" }
blitz-net = { git = "https://github.com/DioxusLabs/blitz", rev = "8b54d6d2930f654d75446e423b42033d323205f0" }
blitz-paint = { path = "vendor/blitz-paint" }
blitz-shell = { git = "https://github.com/DioxusLabs/blitz", rev = "8b54d6d2930f654d75446e423b42033d323205f0" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "8b54d6d2930f654d75446e423b42033d323205f0" }
stylo_taffy = { git = "https://github.com/DioxusLabs/blitz", rev = "8b54d6d2930f654d75446e423b42033d323205f0" }

# Keep Blitz's Taffy API baseline, with bounded Grid track and block-size fixes.
# See vendor/taffy/LAPUI-PATCHES.md before updating or removing this override.
[patch."https://github.com/DioxusLabs/taffy"]
taffy = { path = "vendor/taffy" }

[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "vendor/blitz-dom" }
blitz-paint = { path = "vendor/blitz-paint" }

# Software rasterization and style/layout run on the UI thread. Unoptimized
# dependency code can take seconds per frame, starving input even in dev builds.
# Keep debug information and assertions while optimizing the execution path.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
